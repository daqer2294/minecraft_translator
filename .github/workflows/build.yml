name: Build (Windows + macOS)

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.variant }}
    runs-on: ${{ matrix.os }}
    # Таймаут ограничивает ВРЕМЯ ВЫПОЛНЕНИЯ (не время ожидания раннера в очереди!).
    # Не-Intel легам оставляем дефолт GitHub (360 мин) — их поведение не меняется;
    # Intel-легу задаём короткий 40 мин через matrix.
    timeout-minutes: ${{ matrix.timeout_minutes || 360 }}
    # optional-леги (Intel) не валят весь workflow при сбое/проблемах с раннером
    # и не блокируют win-x64 / mac-arm64 и PR. Для остальных → false (без изменений).
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Полные сборки (с рабочим локальным инференсом из пребилт-колеса):
          - os: windows-latest   # x64, CPU-колесо
            platform: win
            arch: x64
            spec: MinecraftTranslator-win.spec
            reqfile: requirements-win.txt
            variant: ""
          # Windows с NVIDIA: то же, но колесо CUDA 12.4. Пробная: на раннере нет GPU и
          # CUDA Toolkit, поэтому её сбой не валит сборку, а шаг ниже показывает, какие DLL пришли.
          - os: windows-latest
            platform: win
            arch: x64
            spec: MinecraftTranslator-win.spec
            reqfile: requirements-win-cuda.txt
            variant: "-cuda"
            optional: true
            timeout_minutes: 60
          - os: macos-14         # Apple Silicon, Metal-колесо
            platform: mac
            arch: arm64
            spec: MinecraftTranslator-mac.spec
            reqfile: requirements-mac.txt
            variant: ""
          # Intel Mac (external-only): пребилт-колеса llama-cpp-python под macOS
          # x86_64 НЕТ → локальный in-process инференс в сборку не входит
          # (работают external / hybrid / server).
          #
          # ВАЖНО про раннер: macos-13 (Intel Ventura) ВЫВЕДЕН ИЗ ЭКСПЛУАТАЦИИ
          # (полностью недоступен с декабря 2025) — именно из-за него job часами
          # висел в очереди в ожидании несуществующего раннера. Актуальный
          # БЕСПЛАТНЫЙ Intel-раннер для публичных репозиториев — macos-15-intel
          # (x86_64 на GitHub живёт до вывода образа macOS 15, ~осень 2027).
          # Лег помечен optional + короткий timeout: Intel — уходящая ниша, его
          # сбой/недоступность не должны блокировать основные сборки.
          - os: macos-15-intel
            platform: mac
            arch: x64
            spec: MinecraftTranslator-mac.spec
            reqfile: ""
            variant: "-external-only"
            optional: true
            timeout_minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install base deps + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # Локальный инференс — ПИННЕД ПРЕБИЛТ-КОЛЕСО (никакой компиляции из
      # исходников; --only-binary заставит упасть, если колеса нет, вместо
      # тихого сползания в долгую и хрупкую сборку sdist).
      - name: Install local inference (pinned prebuilt wheel)
        if: matrix.reqfile != ''
        run: pip install --only-binary=llama-cpp-python -r ${{ matrix.reqfile }}

      # ЯВНАЯ проверка: без рабочего import llama_cpp job падает с понятным
      # сообщением — чтобы никогда не выпустить «полную» сборку, где local не
      # работает. (Заменяет прежний continue-on-error.)
      # Какие библиотеки пришли с CUDA-колесом и грузится ли оно без CUDA Toolkit.
      - name: (CUDA) inspect llama_cpp libraries
        if: matrix.variant == '-cuda'
        shell: python
        run: |
          import glob, importlib.util, os
          spec = importlib.util.find_spec("llama_cpp")
          lib = os.path.join(os.path.dirname(spec.origin), "lib")
          for path in sorted(glob.glob(os.path.join(lib, "*"))):
              print(os.path.basename(path), os.path.getsize(path))
          try:
              import llama_cpp
              print("import OK", llama_cpp.__version__, "gpu offload:", llama_cpp.llama_supports_gpu_offload())
          except Exception as e:
              print("::warning::llama_cpp does not load on the runner (no GPU, no CUDA Toolkit):", e)

      # Тот же отчёт, что даёт MinecraftTranslator.exe --diagnose. На раннере нет драйвера
      # NVIDIA, так что ggml-cuda.dll здесь не загрузится; важно, на чём именно.
      - name: (CUDA) diagnose on the runner
        if: matrix.variant == '-cuda'
        continue-on-error: true
        run: python -X utf8 -c "from src import win_dll; print(win_dll.diagnose())"

      - name: Verify local inference import (fail job if broken)
        if: matrix.reqfile != '' && matrix.variant != '-cuda'
        shell: python
        run: |
          import sys
          try:
              import llama_cpp
              print("OK llama_cpp", llama_cpp.__version__)
          except Exception as e:
              print("::error::Local inference (llama_cpp) failed to import — "
                    "refusing to ship a 'full' build without working local "
                    "inference. Fix the wheel/pin or mark this variant "
                    "external-only. Details:", e)
              sys.exit(1)

      - name: Build with PyInstaller
        run: pyinstaller --noconfirm --clean ${{ matrix.spec }}

      # Все ли DLL llama_cpp и VC++ попали в папку программы. Падает, если чего-то нет.
      # Печатает импорты каждой DLL: видно, пришли ли cudart64_12/cublas64_12 с колесом.
      - name: (Windows) check DLLs in the built folder
        if: runner.os == 'Windows'
        run: python -X utf8 tools/check_win_bundle.py dist/MinecraftTranslator

      # ---- Packaging ----
      # Сборка Windows теперь папка (onedir): в архиве папка MinecraftTranslator с exe внутри.
      - name: (Windows) package folder into zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $base = "MinecraftTranslator-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.variant }}"
          if (-not (Test-Path dist/MinecraftTranslator/MinecraftTranslator.exe)) { throw "exe not found in dist/MinecraftTranslator" }
          Compress-Archive -Path dist/MinecraftTranslator -DestinationPath "$base.zip" -Force
          Get-ChildItem dist/MinecraftTranslator -Recurse -File | Measure-Object -Property Length -Sum | ForEach-Object { "files: $($_.Count), bytes: $($_.Sum)" }

      - name: (macOS) package .app into .dmg + .zip
        if: runner.os == 'macOS'
        run: |
          APP="dist/MinecraftTranslator.app"
          BASE="MinecraftTranslator-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.variant }}"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$BASE.zip"
          hdiutil create -volname "MinecraftTranslator" -srcfolder "$APP" -ov -format UDZO "$BASE.dmg"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftTranslator-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.variant }}
          if-no-files-found: ignore
          path: |
            MinecraftTranslator-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.variant }}.exe
            MinecraftTranslator-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.variant }}.zip
            MinecraftTranslator-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.variant }}.dmg
